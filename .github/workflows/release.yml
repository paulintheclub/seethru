name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test
        run: scripts/test.sh
      - name: Package (universal, ad-hoc signed)
        run: ARCHS="arm64 x86_64" scripts/package.sh
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/Seethru-*.dmg
            dist/Seethru-*.zip
          generate_release_notes: true
