name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test
        run: scripts/test.sh
      - name: Package (universal, ad-hoc signed)
        run: ARCHS="arm64 x86_64" scripts/package.sh
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/Seethru-*.dmg
            dist/Seethru-*.zip
          generate_release_notes: true
