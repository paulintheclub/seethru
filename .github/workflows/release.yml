name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: scripts/test.sh
      - name: Package (universal, ad-hoc signed)
        run: ARCHS="arm64 x86_64" scripts/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Seethru-*.dmg
            dist/Seethru-*.zip
          generate_release_notes: true
